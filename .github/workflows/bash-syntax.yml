name: Bash syntax

on:
  push:
    branches:
      - main
      - 'emma/**'
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: |
          bash -n backup-security-config.sh
          bash -n configure-entra.sh
          bash -n restore-security-config.sh
